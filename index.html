<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">

    <title>Jogo da Velha Matemático</title>
</head>
<body>

    <header>
        <h1>Jogo da Velha Matemático</h1>
        <div class="placar">
            <span>Jogador X: <span id="pontosX">0</span></span>
            <span>Jogador O: <span id="pontosO">0</span></span>
        </div>
    </header>

    <div class="status" id="status-texto">Vez do jogador 'X'</div>

    <div class="tabuleiro" id="tabuleiro">
        <div class="celula" data-indice="0"></div>
        <div class="celula" data-indice="1"></div>
        <div class="celula" data-indice="2"></div>
        <div class="celula" data-indice="3"></div>
        <div class="celula" data-indice="4"></div>
        <div class="celula" data-indice="5"></div>
        <div class="celula" data-indice="6"></div>
        <div class="celula" data-indice="7"></div>
        <div class="celula" data-indice="8"></div>
    </div>

    <div class="controles">
        <button class="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>

    <!-- Modal de Perguntas -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="pergunta-texto" id="pergunta-texto">Carregando pergunta...</div>
            <div class="opcoes-container" id="opcoes-container">
            </div>
        </div>
    </div>
</body>
<script src="script.js"></script>
</html>
